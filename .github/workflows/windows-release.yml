name: Windows CI and snapshot package

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Gameplay regression
    runs-on: windows-latest

    steps:
      - name: Check out the port
        uses: actions/checkout@v7

      - name: Check out the Noctis IV reference source
        uses: actions/checkout@v7
        with:
          repository: jorisvddonk/Noctis-IV-Plus
          path: _reference/noctis-plus

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify the protected L.in.oleum files
        shell: pwsh
        run: |
          $bad = @()
          foreach ($line in Get-Content PRISTINE.sha256) {
            if (-not $line.Trim()) { continue }
            $want, $size, $path = $line -split '\s+', 3
            if (-not (Test-Path -LiteralPath $path)) {
              $bad += "missing: $path"
              continue
            }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($actual -ne $want -or (Get-Item -LiteralPath $path).Length -ne [int64]$size) {
              $bad += "changed: $path"
            }
          }
          if ($bad.Count) { throw ($bad -join "`n") }

      - name: Run the focused integrated-game regression
        shell: pwsh
        env:
          NOCTIS_REFERENCE_ROOT: ${{ github.workspace }}\_reference\noctis-plus\source
        run: python tests\test_vhgame.py

  compile:
    name: Compile the Windows game from source
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the port
        uses: actions/checkout@v7

      - name: Install the historical compiler runtime
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -o Acquire::Retries=3
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get install -y --no-install-recommends \
            libc6:i386 libx11-6:i386 libxau6:i386 libxcb1:i386 \
            libxdmcp6:i386 xvfb xauth

      - name: Compile the production game
        shell: bash
        run: ./build/compile_vhgame_linux.sh build/vhgame.exe

      - name: Upload the compiled PE
        uses: actions/upload-artifact@v7
        with:
          name: Noctis-IV-windows-x86-compiled
          path: build/vhgame.exe
          if-no-files-found: error

  package:
    name: Windows package
    needs: compile
    runs-on: windows-latest

    steps:
      - name: Check out the port
        uses: actions/checkout@v7

      - name: Download the compiled PE
        uses: actions/download-artifact@v8
        with:
          name: Noctis-IV-windows-x86-compiled
          path: build/compiled

      - name: Install the compiled PE
        shell: pwsh
        run: Copy-Item build\compiled\vhgame.exe work\vhgame.exe -Force

      - name: Assemble the standalone Windows package
        shell: pwsh
        run: .\package_noctis.ps1 -OutputDirectory dist\Noctis-IV -SkipBuild

      - name: Create release archive, checksum, and provenance
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath dist\Noctis-IV -DestinationPath dist\Noctis-IV-windows-x86.zip
          $zip = Get-Item dist\Noctis-IV-windows-x86.zip
          $zipHash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash *$($zip.Name)" | Set-Content -LiteralPath dist\Noctis-IV-windows-x86.zip.sha256 -Encoding ascii

          $sourceHash = (Get-FileHash -LiteralPath work\vhgame.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash -LiteralPath work\vhgame.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $compilerHash = (Get-FileHash -LiteralPath main\linux_compiler.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          $cpuHash = (Get-FileHash -LiteralPath main\cpu\i386m.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          $sysHash = (Get-FileHash -LiteralPath main\sys\win32.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "commit=$env:GITHUB_SHA"
            "source_sha256=$sourceHash"
            "executable_sha256=$exeHash"
            "compiler_sha256=$compilerHash"
            "cpu_pack_sha256=$cpuHash"
            "system_pack_sha256=$sysHash"
            "target=win32/i386m"
            "build_provenance=compiled from checked-out source by the repository Linux compiler on GitHub-hosted Ubuntu; packaged on GitHub-hosted Windows"
          ) | Set-Content -LiteralPath dist\Noctis-IV-windows-x86.provenance.txt -Encoding ascii

      - name: Upload the package artifact
        uses: actions/upload-artifact@v7
        with:
          name: Noctis-IV-windows-x86-snapshot
          path: |
            dist/Noctis-IV-windows-x86.zip
            dist/Noctis-IV-windows-x86.zip.sha256
            dist/Noctis-IV-windows-x86.provenance.txt
          if-no-files-found: error
