name: Interactive source build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interactive-source-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the release revision
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v7

      - name: Check out the Noctis IV reference source
        uses: actions/checkout@v7
        with:
          repository: jorisvddonk/Noctis-IV-Plus
          ref: 94200172ee2ca859de15f0c7b03dfa1939874681
          path: _reference/noctis-plus

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reject production native blocks and float-inventory drift
        shell: pwsh
        run: python tests\test_native_closure.py

      - name: Pin the production FP runtime boundary
        shell: pwsh
        run: python tests\test_fp_runtime_boundary.py

      - name: Check isolated Windows i386 source staging
        shell: pwsh
        run: python tests\test_windows_i386_stage.py

      - name: Check the NIVGEN scorer API
        shell: pwsh
        run: python tests\test_nivgen_score.py

      - name: Check full-sheet snapshot and differential logic
        shell: pwsh
        run: python tests\test_nivgen_sheet_report.py

      - name: Check tag-specific release notes and rerun safety
        shell: pwsh
        run: python tests\test_release_notes.py

      - name: Run the focused integrated-game regression
        shell: pwsh
        env:
          NOCTIS_REFERENCE_ROOT: ${{ github.workspace }}\_reference\noctis-plus\source
        run: python tests\test_vhgame.py

  compile:
    name: Compile on interactive Windows runner
    needs: validate
    runs-on: [self-hosted, Windows, X64, lino-gui]
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false

      - name: Require an interactive desktop session
        shell: pwsh
        run: |
          $session = (Get-Process -Id $PID).SessionId
          if (-not [Environment]::UserInteractive -or $session -eq 0) {
            throw "The L.in.oleum compiler requires run.cmd in a logged-in desktop session, not a Windows service."
          }
          "Interactive runner session: $session"

      - name: Verify the protected L.in.oleum files
        shell: pwsh
        run: |
          $bad = @()
          foreach ($line in Get-Content PRISTINE.sha256) {
            if (-not $line.Trim()) { continue }
            $want, $size, $path = $line -split '\s+', 3
            if (-not (Test-Path -LiteralPath $path)) {
              $bad += "missing: $path"
              continue
            }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($actual -ne $want -or (Get-Item -LiteralPath $path).Length -ne [int64]$size) {
              $bad += "changed: $path"
            }
          }
          if ($bad.Count) { throw ($bad -join "`n") }

      - name: Validate the portable floating-point kernel
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File work\fp\fprun.ps1

      - name: Compare production transcendental consumers with x87
        shell: pwsh
        run: python tests\test_transcendental_consumers.py

      - name: Compile the checked-out game source
        shell: pwsh
        run: |
          $started = [DateTime]::UtcNow
          $stage = Join-Path $env:RUNNER_TEMP ("noctis-i386-source-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $stage) {
            throw "Source staging directory already exists: $stage"
          }
          python tools\stage_windows_i386_source.py --output $stage
          if ($LASTEXITCODE -ne 0) {
            throw "i386 source staging failed with exit code $LASTEXITCODE"
          }

          Remove-Item -LiteralPath 'work\vhgame.exe' -Force -ErrorAction SilentlyContinue
          $source = Join-Path $stage 'work\vhgame.txt'
          & .\lino_build.ps1 `
            -Src $source `
            -Compiler "$PWD\main\lib\gen\compiler114m.exe" `
            -Cpu i386m `
            -TimeoutSec 240 `
            -StageExtension .lxe
          if ($LASTEXITCODE -ne 0) {
            throw "lino_build.ps1 failed with exit code $LASTEXITCODE"
          }

          $compiled = Join-Path $stage 'work\vhgame.exe'
          if (-not (Test-Path -LiteralPath $compiled -PathType Leaf)) {
            throw "Compiler produced no $compiled"
          }
          $file = Get-Item -LiteralPath $compiled
          if ($file.Length -lt 1024 -or $file.LastWriteTimeUtc -lt $started.AddSeconds(-2)) {
            throw 'Compiler output is missing, stale, or implausibly small'
          }

          $bytes = [IO.File]::ReadAllBytes($file.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'Compiler output has no MZ header'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 24 -gt $bytes.Length) {
            throw 'Compiler output has an invalid PE offset'
          }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
            throw 'Compiler output has no PE signature'
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $sections = [BitConverter]::ToUInt16($bytes, $peOffset + 6)
          if ($machine -ne 0x014c -or $sections -eq 0) {
            throw ("Expected a sectioned i386 PE, got machine 0x{0:X4} with {1} sections" -f $machine, $sections)
          }
          Copy-Item -LiteralPath $compiled -Destination 'work\vhgame.exe'
          Get-FileHash -LiteralPath 'work\vhgame.exe' -Algorithm SHA256

      - name: Package the freshly compiled executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          .\package_noctis.ps1 -OutputDirectory dist\Noctis-IV -SkipBuild
          Compress-Archive `
            -LiteralPath dist\Noctis-IV `
            -DestinationPath dist\Noctis-IV-windows-x86.zip

          $zip = Get-Item dist\Noctis-IV-windows-x86.zip
          $zipHash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash *$($zip.Name)" | Set-Content `
            -LiteralPath dist\Noctis-IV-windows-x86.zip.sha256 `
            -Encoding ascii

          $sourceStage = Join-Path $env:RUNNER_TEMP ("noctis-i386-source-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          $sourceManifest = Join-Path $sourceStage 'windows-i386-source.provenance.txt'
          if (-not (Test-Path -LiteralPath $sourceManifest -PathType Leaf)) {
            throw "Missing staged-source provenance: $sourceManifest"
          }
          $sourceRecords = @(Get-Content -LiteralPath $sourceManifest)
          $sourceManifestHash = (Get-FileHash -LiteralPath $sourceManifest -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash -LiteralPath work\vhgame.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $compilerHash = (Get-FileHash -LiteralPath main\lib\gen\compiler114m.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $patcherHash = (Get-FileHash -LiteralPath tools\patch_runtime_fcw.py -Algorithm SHA256).Hash.ToLowerInvariant()
          $buildWrapperHash = (Get-FileHash -LiteralPath lino_build.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $cpuHash = (Get-FileHash -LiteralPath main\cpu\i386m.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          $systemHash = (Get-FileHash -LiteralPath main\sys\win32.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "commit=$env:GITHUB_SHA"
            "source_manifest_sha256=$sourceManifestHash"
            $sourceRecords
            "runtime_patcher_sha256=$patcherHash"
            "build_wrapper_sha256=$buildWrapperHash"
            "executable_sha256=$exeHash"
            "archive_sha256=$zipHash"
            "compiler_sha256=$compilerHash"
            "cpu_pack_sha256=$cpuHash"
            "system_pack_sha256=$systemHash"
            "validation_reference_commit=94200172ee2ca859de15f0c7b03dfa1939874681"
            "target=win32/i386m"
          ) | Set-Content -LiteralPath dist\Noctis-IV-windows-x86.source.txt -Encoding ascii

      - name: Upload the source-built package
        uses: actions/upload-artifact@v7
        with:
          name: Noctis-IV-windows-x86-source-build
          path: |
            dist/Noctis-IV-windows-x86.zip
            dist/Noctis-IV-windows-x86.zip.sha256
            dist/Noctis-IV-windows-x86.source.txt
          if-no-files-found: error
