name: macOS AArch64 runtime

on:
  workflow_call:
    inputs:
      tagged_release:
        description: Build package metadata from the caller's release tag
        required: false
        type: boolean
        default: false
      package_artifact_name:
        description: Artifact name for the three publishable package files
        required: false
        type: string
        default: ""
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/macos-aarch64-runtime.yml"
      - "src/linoleum_macos_aarch64/**"
      - "build/compile_macos_aarch64_fixture.sh"
      - "build/build_compiler114m_linux.sh"
      - "tools/finalize_macos_aarch64.py"
      - "tools/package_noctis_macos_aarch64.py"
      - "tools/package_noctis_macos.py"
      - "tools/pack_lino_sys.py"
      - "tools/make_noctis_checkpoint.py"
      - "src/noctis_macos_launcher/launcher.c"
      - "PLAYER_README.txt"
      - "LICENSE.htm"
      - "tests/fixtures/macos_aarch64_runtime.txt"
      - "tests/test_macos_aarch64_runtime.py"
      - "tests/test_sun_gallery.py"
      - "tests/gen/recon_w7b/out/hab_sun270_pinned_oracle.shot.BMP"
      - "tests/run_all.py"
      - "src/linoleum_macos64/lino_cocoa.m"
      - "src/linoleum_macos64/lino_display.h"
      - "src/linoleum_macos64/lino_event.h"
      - "src/linoleum_macos64/lino_file.c"
      - "src/linoleum_macos64/lino_file.h"
      - "src/linoleum_macos64/lino_globalK.c"
      - "src/linoleum_macos64/lino_globalK.h"
      - "src/linoleum_macos64/lino_keyboard.c"
      - "src/linoleum_macos64/lino_keyboard.h"
      - "src/linoleum_macos64/lino_kernel.h"
      - "src/linoleum_macos64/lino_luck.h"
      - "src/linoleum_macos64/lino_mouse.h"
      - "src/linoleum_macos64/lino_sound.c"
      - "src/linoleum_macos64/lino_sound.h"
      - "src/linoleum_macos64/lino_types.h"
      - "src/linoleum_macos64/rtm.h"
      - "work/**.txt"
      - "work/*.tga"
      - "work/globes.map"
      - "work/offsets.map"
      - "work/vehicle.ncc"
      - "work/mammal.ncc"
      - "work/birdy.ncc"
      - "work/digimap2.bin"
      - "work/STARMAP.BIN"
      - "work/GUIDE.BIN"
      - "work/noctis_music.pcm"
      - "main/lib/gen/compiler114m.txt"
      - "main/lib/gen/bits.txt"
      - "main/lib/gen/bytes.txt"
      - "main/linux_compiler.bin"
      - "main/cpu/i386.bin"
      - "main/cpu/i386m.bin"
      - "main/sys/linux.bin"
  pull_request:
    paths:
      - ".github/workflows/macos-aarch64-runtime.yml"
      - "src/linoleum_macos_aarch64/**"
      - "build/compile_macos_aarch64_fixture.sh"
      - "build/build_compiler114m_linux.sh"
      - "tools/finalize_macos_aarch64.py"
      - "tools/package_noctis_macos_aarch64.py"
      - "tools/package_noctis_macos.py"
      - "tools/pack_lino_sys.py"
      - "tools/make_noctis_checkpoint.py"
      - "src/noctis_macos_launcher/launcher.c"
      - "PLAYER_README.txt"
      - "LICENSE.htm"
      - "tests/fixtures/macos_aarch64_runtime.txt"
      - "tests/test_macos_aarch64_runtime.py"
      - "tests/test_sun_gallery.py"
      - "tests/gen/recon_w7b/out/hab_sun270_pinned_oracle.shot.BMP"
      - "tests/run_all.py"
      - "src/linoleum_macos64/lino_cocoa.m"
      - "src/linoleum_macos64/lino_display.h"
      - "src/linoleum_macos64/lino_event.h"
      - "src/linoleum_macos64/lino_file.c"
      - "src/linoleum_macos64/lino_file.h"
      - "src/linoleum_macos64/lino_globalK.c"
      - "src/linoleum_macos64/lino_globalK.h"
      - "src/linoleum_macos64/lino_keyboard.c"
      - "src/linoleum_macos64/lino_keyboard.h"
      - "src/linoleum_macos64/lino_kernel.h"
      - "src/linoleum_macos64/lino_luck.h"
      - "src/linoleum_macos64/lino_mouse.h"
      - "src/linoleum_macos64/lino_sound.c"
      - "src/linoleum_macos64/lino_sound.h"
      - "src/linoleum_macos64/lino_types.h"
      - "src/linoleum_macos64/rtm.h"
      - "work/**.txt"
      - "work/*.tga"
      - "work/globes.map"
      - "work/offsets.map"
      - "work/vehicle.ncc"
      - "work/mammal.ncc"
      - "work/birdy.ncc"
      - "work/digimap2.bin"
      - "work/STARMAP.BIN"
      - "work/GUIDE.BIN"
      - "work/noctis_music.pcm"
      - "main/lib/gen/compiler114m.txt"
      - "main/lib/gen/bits.txt"
      - "main/lib/gen/bytes.txt"
      - "main/linux_compiler.bin"
      - "main/cpu/i386.bin"
      - "main/cpu/i386m.bin"
      - "main/sys/linux.bin"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Build unsigned native RTM
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check out the runtime source
        uses: actions/checkout@v7

      - name: Run structural and Mach-O tests
        run: python3 tests/test_macos_aarch64_runtime.py

      - name: Build the thin arm64 runtime
        shell: bash
        run: |
          set -eu
          test "$(uname -m)" = arm64
          BUILD_DIR="$PWD/build/macos-aarch64-rtm" \
            OUTPUT="$PWD/build/macos-aarch64-rtm/rtm01.bin" \
            ./src/linoleum_macos_aarch64/build.sh
          file build/macos-aarch64-rtm/rtm01.bin | grep -q 'arm64'
          test "$(lipo -archs build/macos-aarch64-rtm/rtm01.bin)" = arm64
          otool -L build/macos-aarch64-rtm/rtm01.bin \
            | grep -q '/Cocoa.framework/'
          otool -L build/macos-aarch64-rtm/rtm01.bin \
            | grep -q '/AudioToolbox.framework/'
          xcrun vtool -show-build build/macos-aarch64-rtm/rtm01.bin \
            | grep -Eq 'minos[[:space:]]+11\.0'
          if codesign --verify build/macos-aarch64-rtm/rtm01.bin \
              >/dev/null 2>&1; then
            echo 'RTM must be unsigned before the compiler appends Lino' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          from tools.finalize_macos_aarch64 import load_commands, validate_pagezero
          data = Path("build/macos-aarch64-rtm/rtm01.bin").read_bytes()
          _header, commands = load_commands(data)
          validate_pagezero(data, commands)
          print("Unsigned native RTM has the full 4 GiB PAGEZERO")
          PY

      - name: Upload the unsigned runtime
        uses: actions/upload-artifact@v7
        with:
          name: macos-aarch64-unsigned-rtm
          path: build/macos-aarch64-rtm/rtm01.bin
          if-no-files-found: error

  compile:
    name: Compile Lino fixture into native RTM
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out compiler and fixture source
        uses: actions/checkout@v7

      - name: Download unsigned native runtime
        uses: actions/download-artifact@v8
        with:
          name: macos-aarch64-unsigned-rtm
          path: build/macos-aarch64-rtm

      - name: Install the historical compiler runtime
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libc6:i386 libx11-6:i386 util-linux xvfb xauth

      - name: Bootstrap compiler and append compiler-owned AArch64
        shell: bash
        run: |
          set -eu
          ./build/build_compiler114m_linux.sh build/linux-compiler114m.bin
          ./build/compile_macos_aarch64_fixture.sh \
            build/linux-compiler114m.bin \
            build/macos-aarch64-rtm/rtm01.bin \
            tests/fixtures/macos_aarch64_runtime.txt \
            build/macos-aarch64-fixture.unsigned
          ./build/compile_macos_aarch64_fixture.sh \
            build/linux-compiler114m.bin \
            build/macos-aarch64-rtm/rtm01.bin \
            work/vhgame.txt \
            build/macos-aarch64-noctis.unsigned \
            tracked-work
          python3 - <<'PY'
          from pathlib import Path
          import struct

          image = Path("build/macos-aarch64-noctis.unsigned").read_bytes()
          marker = image.index(b"LNLMInit") + len(b"LNLMInit") + 40
          fields = struct.unpack_from("<14i", image, marker)
          app_workspace = fields[0]
          default_ramtop = fields[5]
          service_units = 32947
          if default_ramtop < app_workspace + service_units:
              raise SystemExit(
                  "compiled Noctis image leaves insufficient service UI workspace: "
                  f"RAMtop={default_ramtop}, app={app_workspace}, "
                  f"required={service_units}"
              )
          print(
              "Compiled full Noctis AArch64 image with service UI workspace: "
              f"RAMtop={default_ramtop}, app={app_workspace}"
          )
          PY
          python3 tools/finalize_macos_aarch64.py \
            build/macos-aarch64-fixture.unsigned \
            build/macos-aarch64-fixture.normalized
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          paths = (
              "build/linux-compiler114m.bin",
              "build/macos-aarch64-rtm/rtm01.bin",
              "tests/fixtures/macos_aarch64_runtime.txt",
              "build/macos-aarch64-fixture.unsigned",
              "work/vhgame.txt",
              "build/macos-aarch64-noctis.unsigned",
          )
          lines = [f"commit={os.environ['GITHUB_SHA']}\n"]
          for name in paths:
              digest = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              lines.append(f"{name}_sha256={digest}\n")
          Path("build/macos-aarch64-fixture.provenance.txt").write_text(
              "".join(lines), encoding="ascii")
          PY

      - name: Upload compiler-appended image
        uses: actions/upload-artifact@v7
        with:
          name: macos-aarch64-compiler-image
          path: |
            build/macos-aarch64-fixture.unsigned
            build/macos-aarch64-noctis.unsigned
            build/macos-aarch64-fixture.provenance.txt
          if-no-files-found: error

  native:
    name: Finalize and execute on Apple Silicon
    needs: compile
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check out finalizer and test oracle
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download compiler-appended image
        uses: actions/download-artifact@v8
        with:
          name: macos-aarch64-compiler-image
          path: build/compiler-image

      - name: Normalize, sign, and execute natively
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          input=build/compiler-image/macos-aarch64-fixture.unsigned
          output=build/macos-aarch64-fixture
          chmod +x "$input"
          python3 tools/finalize_macos_aarch64.py --sign "$input" "$output"
          file "$output" | grep -q 'arm64'
          test "$(lipo -archs "$output")" = arm64
          codesign --verify --strict --verbose=2 "$output"
          fixture_home="$PWD/build/macos-aarch64-fixture-home"
          rm -rf "$fixture_home"
          mkdir -p "$fixture_home"
          HOME="$fixture_home" arch -arm64 "$output" arm64-fixture \
            | tee build/macos-aarch64-result.txt
          test ! -e \
            "$fixture_home/Library/Application Support/Linoleum/GlobalK/ARM64_GlobalK_fixture_"
          rm -rf "$fixture_home"
          python3 - <<'PY'
          from pathlib import Path

          text = Path("build/macos-aarch64-result.txt").read_text(encoding="utf-8").strip()
          prefix = "MACOS_AARCH64_RUNTIME_RESULT "
          if not text.startswith(prefix):
              raise SystemExit(f"missing native runtime result: {text!r}")
          values = dict(field.split("=", 1) for field in text[len(prefix):].split())
          expected = {
              "status": "0",
              "A": "646F6E65",
              "B": "00000000",
              "C": "00000002",
              "D": "00000010",
              "E": "0000AC44",
              "X": "646F6E65",
          }
          if any(values.get(key) != value for key, value in expected.items()):
              raise SystemExit(f"native AArch64 register mismatch: {values!r}")
          for key in ("code", "workspace", "isokernel"):
              if int(values[key], 16) <= 0xFFFFFFFF:
                  raise SystemExit(f"{key} pointer was truncated: {values[key]}")
          print("Native compiler-owned AArch64 fixture passed above 4 GiB")
          PY

      - name: Finalize and smoke full Noctis natively
        shell: bash
        run: |
          set -euo pipefail
          input=build/compiler-image/macos-aarch64-noctis.unsigned
          output="$PWD/build/Noctis-IV-arm64.game"
          data="$PWD/build/noctis-arm64-data"
          chmod +x "$input"
          python3 tools/finalize_macos_aarch64.py --sign "$input" "$output"
          file "$output" | grep -q 'arm64'
          test "$(lipo -archs "$output")" = arm64
          otool -L "$output" | grep -q '/Cocoa.framework/'
          otool -L "$output" | grep -q '/AudioToolbox.framework/'
          codesign --verify --strict --verbose=2 "$output"

          rm -rf "$data"
          mkdir -p "$data"
          for file in globes.map offsets.map vehicle.ncc mammal.ncc birdy.ncc \
            digimap2.bin STARMAP.BIN GUIDE.BIN noctis_music.pcm; do
            install -m 0644 "work/$file" "$data/$file"
          done

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          executable = Path("build/Noctis-IV-arm64.game").resolve()
          data = Path("build/noctis-arm64-data").resolve()

          def run_smoke(switch, marker, log_name):
              result = subprocess.run(
                  ["arch", "-arm64", str(executable), switch],
                  cwd=data,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=180,
              )
              output = result.stdout
              if result.returncode < 0:
                  diagnostic = subprocess.run(
                      ["lldb", "--batch", "-o", "run",
                       "-k", "thread backtrace all",
                       "-k", "register read pc lr sp x19 x20 x21 x22 x23 x24 x25",
                       str(executable), "--", switch],
                      cwd=data,
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      timeout=180,
                  )
                  output += "\nLLDB CRASH DIAGNOSTIC\n" + diagnostic.stdout
              print(output)
              Path(log_name).write_text(output, encoding="utf-8")
              if result.returncode != 0 or marker not in result.stdout:
                  raise SystemExit(
                      f"{switch} failed with status {result.returncode}")

          run_smoke("--cocoa-smoke", "COCOA_SMOKE_OK",
                    "build/macos-aarch64-cocoa-smoke.txt")
          checkpoint = data / "CURRENT.LIN"
          checkpoint.unlink(missing_ok=True)
          run_smoke("--cocoa-quit-smoke", "COCOA_QUIT_SMOKE_OK",
                    "build/macos-aarch64-cocoa-quit-smoke.txt")
          if not checkpoint.is_file() or checkpoint.stat().st_size == 0:
              raise SystemExit("graceful ARM64 Cocoa quit did not save CURRENT.LIN")
          print("Native ARM64 Cocoa retrace and graceful Lino shutdown passed")
          PY

          python3 tools/make_noctis_checkpoint.py "$data/CURRENT.LIN" \
            --star-x 1463568 --star-y -4728350 --star-z -437812 \
            --body 3 --longitude 270 --latitude 60 \
            --beta 65 --pitch -44 \
            --player-x 1598248 --player-z 2251369 --fast
          cp "$data/CURRENT.LIN" "$data/CURRENT.BAK"
          rm -f "$data"/game-*-out.bin
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess

          executable = Path("build/Noctis-IV-arm64.game").resolve()
          data = Path("build/noctis-arm64-data").resolve()
          arguments = ("clock=1344638527", "quit")
          result = subprocess.run(
              ["arch", "-arm64", str(executable), *arguments],
              cwd=data,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              timeout=300,
          )
          output = result.stdout
          if result.returncode < 0:
              diagnostic = subprocess.run(
                  ["lldb", "--batch", "-o", "run",
                   "-k", "thread backtrace all",
                   "-k", "register read pc lr sp x19 x20 x21 x22 x23 x24 x25",
                   str(executable), "--", *arguments],
                  cwd=data,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=180,
              )
              output += "\nLLDB CRASH DIAGNOSTIC\n" + diagnostic.stdout
          print(output)
          Path("build/macos-aarch64-sun-oracle.txt").write_text(
              output, encoding="utf-8")
          if result.returncode != 0:
              raise SystemExit(
                  f"pinned ARM64 product run failed with status {result.returncode}")

          expected = {
              "game-vh-out.bin": 156,
              "game-sun-out.bin": 128,
              "game-local-out.bin": 176,
              "game-palette-out.bin": 3072,
              "game-page-out.bin": 64000,
          }
          gallery = Path("build/sun-gallery")
          gallery.mkdir(parents=True, exist_ok=True)
          for name, size in expected.items():
              source = data / name
              if not source.is_file() or source.stat().st_size != size:
                  raise SystemExit(
                      f"product did not emit {name} at exactly {size} bytes")
              shutil.copyfile(source, gallery / f"habitable-{name}")
          print("Native ARM64 product emitted complete pinned sun diagnostics")
          PY
          python3 tests/test_sun_gallery.py \
            --case hab-sun270 \
            --product-directory build/sun-gallery

      - name: Retain native sun-oracle diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-aarch64-sun-oracle-${{ github.sha }}
          path: |
            build/macos-aarch64-sun-oracle.txt
            build/sun-gallery/habitable-game-*-out.bin
          if-no-files-found: warn
          retention-days: 7

      - name: Derive native package versions
        id: version
        shell: bash
        env:
          TAGGED_RELEASE: ${{ inputs.tagged_release || false }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          if os.environ["TAGGED_RELEASE"] == "true":
              tag = os.environ["GITHUB_REF_NAME"]
              match = re.fullmatch(
                  r"v(\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?",
                  tag,
              )
              if not match:
                  raise SystemExit(f"tag cannot form a bundle version: {tag!r}")
              short = match.group(1)
              label = tag
          else:
              short = "0.1.0"
              label = f"development-{os.environ['GITHUB_SHA'][:12]}"
          print(f"short={short}")
          print(f"label={label}")
          PY

      - name: Package and smoke the Finder-safe ARM64 app
        shell: bash
        env:
          BUNDLE_SHORT_VERSION: ${{ steps.version.outputs.short }}
          RELEASE_LABEL: ${{ steps.version.outputs.label }}
        run: |
          set -euo pipefail
          python3 tools/package_noctis_macos_aarch64.py \
            --game build/Noctis-IV-arm64.game \
            --unsigned-game build/compiler-image/macos-aarch64-noctis.unsigned \
            --build-provenance build/compiler-image/macos-aarch64-fixture.provenance.txt \
            --output dist \
            --short-version "$BUNDLE_SHORT_VERSION" \
            --build-version "$GITHUB_RUN_NUMBER" \
            --release-label "$RELEASE_LABEL" \
            --expected-commit "$GITHUB_SHA"

          rm -rf build/arm64-package-smoke build/noctis-arm64-package-data
          mkdir -p build/arm64-package-smoke
          ditto -x -k dist/Noctis-IV-macos-arm64.zip build/arm64-package-smoke
          app="$PWD/build/arm64-package-smoke/Noctis IV.app"
          launcher="$app/Contents/MacOS/Noctis-IV"
          game="$app/Contents/MacOS/Noctis-IV.game"
          data="$PWD/build/noctis-arm64-package-data"

          test "$(lipo -archs "$launcher")" = arm64
          test "$(lipo -archs "$game")" = arm64
          otool -L "$game" | grep -q '/Cocoa.framework/'
          otool -L "$game" | grep -q '/AudioToolbox.framework/'
          xcrun vtool -show-build "$launcher" | grep -Eq 'minos[[:space:]]+11\.0'
          xcrun vtool -show-build "$game" | grep -Eq 'minos[[:space:]]+11\.0'
          plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist" \
            | grep -qx 'io.github.fabulu.noctis-iv'
          plutil -extract LSArchitecturePriority.0 raw "$app/Contents/Info.plist" \
            | grep -qx arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("tools").resolve()))
          from finalize_macos_aarch64 import validate_final
          from package_noctis_macos import verify_manifest

          app = Path("build/arm64-package-smoke/Noctis IV.app")
          verify_manifest(app)
          validate_final((app / "Contents/MacOS/Noctis-IV.game").read_bytes())
          print("Extracted ARM64 app manifest and game signature geometry verified")
          PY

          NOCTIS_DATA_DIR="$data" arch -arm64 "$launcher" \
            --launcher-prepare-only | grep -q '^NOCTIS_DATA_DIR='
          for file in globes.map offsets.map vehicle.ncc mammal.ncc birdy.ncc \
            digimap2.bin noctis_music.pcm STARMAP.BIN GUIDE.BIN; do
            test -f "$data/$file"
          done
          for seed in STARMAP.BIN GUIDE.BIN; do
            cp "$data/$seed" "build/$seed.arm64-seed"
            printf 'user-state-must-survive' >> "$data/$seed"
            cp "$data/$seed" "build/$seed.arm64-modified"
          done
          rm "$data/globes.map"
          NOCTIS_DATA_DIR="$data" arch -arm64 "$launcher" \
            --launcher-prepare-only >/dev/null
          cmp "$data/globes.map" "$app/Contents/Resources/globes.map"
          for seed in STARMAP.BIN GUIDE.BIN; do
            cmp "$data/$seed" "build/$seed.arm64-modified"
            cp "build/$seed.arm64-seed" "$data/$seed"
          done

          mv "$data/GUIDE.BIN" build/GUIDE.arm64-regular
          mkdir "$data/GUIDE.BIN"
          if NOCTIS_DATA_DIR="$data" arch -arm64 "$launcher" \
              --launcher-prepare-only >/dev/null 2>&1; then
            echo 'ARM64 launcher accepted a non-regular mutable seed' >&2
            exit 1
          fi
          rmdir "$data/GUIDE.BIN"
          mv build/GUIDE.arm64-regular "$data/GUIDE.BIN"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          launcher = Path(
              "build/arm64-package-smoke/Noctis IV.app/Contents/MacOS/Noctis-IV"
          ).resolve()
          data = Path("build/noctis-arm64-package-data").resolve()
          environment = os.environ.copy()
          environment["NOCTIS_DATA_DIR"] = str(data)

          def run_smoke(switch, marker, log_name):
              result = subprocess.run(
                  ["arch", "-arm64", str(launcher), switch],
                  env=environment,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=180,
              )
              print(result.stdout)
              Path(log_name).write_text(result.stdout, encoding="utf-8")
              if result.returncode != 0 or marker not in result.stdout:
                  raise SystemExit(
                      f"packaged {switch} failed with status {result.returncode}")

          run_smoke("--cocoa-smoke", "COCOA_SMOKE_OK",
                    "build/macos-aarch64-package-cocoa-smoke.txt")
          checkpoint = data / "CURRENT.LIN"
          checkpoint.unlink(missing_ok=True)
          run_smoke("--cocoa-quit-smoke", "COCOA_QUIT_SMOKE_OK",
                    "build/macos-aarch64-package-cocoa-quit-smoke.txt")
          if not checkpoint.is_file() or checkpoint.stat().st_size == 0:
              raise SystemExit("packaged graceful quit did not save CURRENT.LIN")
          print("Packaged native ARM64 app retrace and graceful shutdown passed")
          PY

      - name: Upload publishable native package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package_artifact_name || format('Noctis-IV-macos-arm64-{0}', github.sha) }}
          path: |
            dist/Noctis-IV-macos-arm64.zip
            dist/Noctis-IV-macos-arm64.zip.sha256
            dist/Noctis-IV-macos-arm64.provenance.txt
          if-no-files-found: error

      - name: Upload native execution evidence
        uses: actions/upload-artifact@v7
        with:
          name: macos-aarch64-native-fixture-${{ github.sha }}
          path: |
            build/macos-aarch64-fixture
            build/macos-aarch64-result.txt
            build/Noctis-IV-arm64.game
            build/macos-aarch64-cocoa-smoke.txt
            build/macos-aarch64-cocoa-quit-smoke.txt
            build/noctis-arm64-data/CURRENT.LIN
            build/macos-aarch64-package-cocoa-smoke.txt
            build/macos-aarch64-package-cocoa-quit-smoke.txt
            build/noctis-arm64-package-data/CURRENT.LIN
            build/compiler-image/macos-aarch64-fixture.provenance.txt
            dist/Noctis-IV-macos-arm64.zip
            dist/Noctis-IV-macos-arm64.zip.sha256
            dist/Noctis-IV-macos-arm64.provenance.txt
          if-no-files-found: error
