name: Tagged Noctis IV release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: tagged-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test the tagged revision
    runs-on: windows-latest

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v7

      - name: Check out the Noctis IV reference source
        uses: actions/checkout@v7
        with:
          repository: jorisvddonk/Noctis-IV-Plus
          ref: 94200172ee2ca859de15f0c7b03dfa1939874681
          path: _reference/noctis-plus

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify the protected L.in.oleum files
        shell: pwsh
        run: |
          $bad = @()
          foreach ($line in Get-Content PRISTINE.sha256) {
            if (-not $line.Trim()) { continue }
            $want, $size, $path = $line -split '\s+', 3
            if (-not (Test-Path -LiteralPath $path)) {
              $bad += "missing: $path"
              continue
            }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            if ($actual -ne $want -or (Get-Item -LiteralPath $path).Length -ne [int64]$size) {
              $bad += "changed: $path"
            }
          }
          if ($bad.Count) { throw ($bad -join "`n") }

      - name: Reject production native blocks and float-inventory drift
        shell: pwsh
        run: python tests\test_native_closure.py

      - name: Pin the production FP runtime boundary
        shell: pwsh
        run: python tests\test_fp_runtime_boundary.py

      - name: Check the NIVGEN scorer API
        shell: pwsh
        run: python tests\test_nivgen_score.py

      - name: Check full-sheet snapshot and differential logic
        shell: pwsh
        run: python tests\test_nivgen_sheet_report.py

      - name: Check tag-specific release notes and rerun safety
        shell: pwsh
        run: python tests\test_release_notes.py

      - name: Validate this pushed tag's release-note section
        shell: pwsh
        run: python tools\release_notes_for_tag.py $env:GITHUB_REF_NAME --output build\tag-release-notes.md

      - name: Run the focused integrated-game regression
        shell: pwsh
        env:
          NOCTIS_REFERENCE_ROOT: ${{ github.workspace }}\_reference\noctis-plus\source
        run: python tests\test_vhgame.py

  compile:
    name: Compile the tagged Windows game
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v7

      - name: Install the historical compiler runtime
        shell: bash
        run: ./build/install_linux_compiler_runtime.sh

      - name: Compile the production game
        shell: bash
        run: ./build/compile_vhgame_linux.sh build/vhgame.exe

      - name: Upload the compiled outputs
        uses: actions/upload-artifact@v7
        with:
          name: Noctis-IV-windows-x86-compiled-${{ github.ref_name }}
          path: |
            build/vhgame.exe
            build/linux-compiler114m.bin
            build/windows-build.provenance.txt
          if-no-files-found: error

  package:
    name: Build the release package
    needs: compile
    runs-on: windows-latest

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download the compiled PE
        uses: actions/download-artifact@v8
        with:
          name: Noctis-IV-windows-x86-compiled-${{ github.ref_name }}
          path: build/compiled

      - name: Install the compiled PE
        shell: pwsh
        run: Copy-Item build\compiled\vhgame.exe work\vhgame.exe -Force

      - name: Verify the compiled Windows executable
        shell: pwsh
        run: |
          $path = 'work\vhgame.exe'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw 'The tagged revision contains no work\vhgame.exe'
          }
          $bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'The versioned executable is not a plausible Windows PE'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 24 -gt $bytes.Length -or
              $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
              $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
            throw 'The versioned executable has an invalid PE signature'
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $sections = [BitConverter]::ToUInt16($bytes, $peOffset + 6)
          if ($machine -ne 0x014c -or $sections -eq 0) {
            throw ("Expected a sectioned i386 PE, got machine 0x{0:X4} with {1} sections" -f $machine, $sections)
          }

      - name: Assemble the standalone Windows package
        shell: pwsh
        run: .\package_noctis.ps1 -OutputDirectory dist\Noctis-IV -SkipBuild

      - name: Launch the package from an unrelated directory
        shell: pwsh
        run: python tests\test_windows_package.py --package dist\Noctis-IV

      - name: Create archive, checksum, and provenance
        shell: pwsh
        run: |
          Compress-Archive `
            -LiteralPath dist\Noctis-IV `
            -DestinationPath dist\Noctis-IV-windows-x86.zip

          $zip = Get-Item dist\Noctis-IV-windows-x86.zip
          $zipHash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash *$($zip.Name)" | Set-Content `
            -LiteralPath dist\Noctis-IV-windows-x86.zip.sha256 `
            -Encoding ascii

          $buildProvenance = 'build\compiled\windows-build.provenance.txt'
          $values = @{}
          foreach ($line in Get-Content -LiteralPath $buildProvenance) {
            if (-not $line.Trim()) { continue }
            $key, $value = $line -split '=', 2
            $values[$key] = $value
          }
          $requiredKeys = @(
            'commit', 'source_sha256',
            'runtime_patcher_sha256', 'executable_sha256', 'compile_script_sha256',
            'compiler_runtime_installer_sha256', 'bootstrap_compiler_sha256',
            'compiler_source_sha256',
            'compiler_bits_library_sha256', 'compiler_bytes_library_sha256',
            'compiler_build_script_sha256', 'bootstrap_cpu_pack_sha256',
            'bootstrap_system_pack_sha256', 'compiler_sha256', 'cpu_pack_sha256',
            'system_pack_sha256', 'target', 'build_provenance'
          )
          foreach ($key in $requiredKeys) {
            if (-not $values.ContainsKey($key)) { throw "Build provenance lacks $key" }
          }
          if ($values.commit -ne $env:GITHUB_SHA -or $values.target -ne 'win32/i386m') {
            throw 'Build provenance does not identify this commit and target'
          }
          $sourceHash = (Get-FileHash -LiteralPath work\vhgame.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash -LiteralPath work\vhgame.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $compilerHash = (Get-FileHash -LiteralPath build\compiled\linux-compiler114m.bin -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($values.source_sha256 -ne $sourceHash -or
              $values.executable_sha256 -ne $exeHash -or
              $values.compiler_sha256 -ne $compilerHash) {
            throw 'Checked-out source, downloaded compiler, or executable does not match its Linux build provenance'
          }
          Copy-Item -LiteralPath $buildProvenance -Destination dist\Noctis-IV-windows-x86.provenance.txt
          @(
            "archive_sha256=$zipHash"
            'validation_reference_commit=94200172ee2ca859de15f0c7b03dfa1939874681'
          ) | Add-Content -LiteralPath dist\Noctis-IV-windows-x86.provenance.txt -Encoding ascii

      - name: Upload the tagged package
        uses: actions/upload-artifact@v7
        with:
          name: Noctis-IV-windows-x86-${{ github.ref_name }}
          path: |
            dist/Noctis-IV-windows-x86.zip
            dist/Noctis-IV-windows-x86.zip.sha256
            dist/Noctis-IV-windows-x86.provenance.txt
          if-no-files-found: error

  mac_runtime:
    name: Build tagged macOS x86_64 runtimes
    needs: validate
    runs-on: macos-15

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v7

      - name: Build unsigned headless and Cocoa runtimes
        shell: bash
        run: |
          set -eu
          test "$(uname -m)" = arm64
          mkdir -p build/macos-rtm
          HEADLESS=1 ./src/linoleum_macos64/build.sh
          cp src/linoleum_macos64/rtm01.bin build/macos-rtm/headless-rtm01.bin
          HEADLESS=0 ./src/linoleum_macos64/build.sh
          cp src/linoleum_macos64/rtm01.bin build/macos-rtm/cocoa-rtm01.bin

          file build/macos-rtm/headless-rtm01.bin | grep -q 'x86_64'
          file build/macos-rtm/cocoa-rtm01.bin | grep -q 'x86_64'
          if otool -L build/macos-rtm/headless-rtm01.bin | grep -Eq '/(Cocoa|AudioToolbox)\.framework/'; then
            echo 'Headless runtime unexpectedly links a GUI/audio framework' >&2
            exit 1
          fi
          otool -L build/macos-rtm/cocoa-rtm01.bin | grep -q '/Cocoa.framework/'
          otool -L build/macos-rtm/cocoa-rtm01.bin | grep -q '/AudioToolbox.framework/'
          for runtime in build/macos-rtm/*-rtm01.bin; do
            xcrun vtool -show-build "$runtime" | grep -Eq 'minos[[:space:]]+10\.15'
            if codesign --verify "$runtime" >/dev/null 2>&1; then
              echo "RTM must be unsigned before compilation: $runtime" >&2
              exit 1
            fi
          done
          python3 tools/macos_runtime_provenance.py write \
            --runtime build/macos-rtm/headless-rtm01.bin \
            --provenance build/macos-rtm/headless-runtime.provenance.txt \
            --mode headless --commit "$GITHUB_SHA"
          python3 tools/macos_runtime_provenance.py write \
            --runtime build/macos-rtm/cocoa-rtm01.bin \
            --provenance build/macos-rtm/cocoa-runtime.provenance.txt \
            --mode cocoa --commit "$GITHUB_SHA"

      - name: Upload tagged runtimes
        uses: actions/upload-artifact@v7
        with:
          name: macos-x86_64-rtms-${{ github.ref_name }}
          path: build/macos-rtm
          if-no-files-found: error

  mac_compile:
    name: Compile the tagged macOS game
    needs: mac_runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v7

      - name: Download tagged runtimes
        uses: actions/download-artifact@v8
        with:
          name: macos-x86_64-rtms-${{ github.ref_name }}
          path: build/macos-rtm

      - name: Install the historical compiler runtime
        shell: bash
        run: ./build/install_linux_compiler_runtime.sh

      - name: Compile tagged generator and game
        shell: bash
        run: |
          ./build/compile_nivtest_linux.sh \
            build/macos-rtm/headless-rtm01.bin build/nivtest \
            build/macos-rtm/headless-runtime.provenance.txt \
            build/nivtest-build.provenance.txt
          ./build/compile_noctis_macos_linux.sh \
            build/macos-rtm/cocoa-rtm01.bin build/Noctis-IV.game \
            build/macos-rtm/cocoa-runtime.provenance.txt

      - name: Upload tagged compiled macOS outputs
        uses: actions/upload-artifact@v7
        with:
          name: macos-x86_64-compiled-${{ github.ref_name }}
          path: |
            build/nivtest
            build/nivtest-build.provenance.txt
            build/Noctis-IV.game
            build/linux-compiler114m.bin
            build/macos-build.provenance.txt
          if-no-files-found: error

  mac_package:
    name: Test and package the tagged macOS app
    needs: mac_compile
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download tagged compiled outputs
        uses: actions/download-artifact@v8
        with:
          name: macos-x86_64-compiled-${{ github.ref_name }}
          path: build/compiled

      - name: Download tagged runtimes
        uses: actions/download-artifact@v8
        with:
          name: macos-x86_64-rtms-${{ github.ref_name }}
          path: build/macos-rtm

      - name: Verify transferred build provenance
        shell: bash
        run: |
          python3 tools/macos_runtime_provenance.py verify \
            --runtime build/macos-rtm/headless-rtm01.bin \
            --provenance build/macos-rtm/headless-runtime.provenance.txt \
            --mode headless --commit "$GITHUB_SHA"
          python3 tools/macos_runtime_provenance.py verify \
            --runtime build/macos-rtm/cocoa-rtm01.bin \
            --provenance build/macos-rtm/cocoa-runtime.provenance.txt \
            --mode cocoa --commit "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          def sha256(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def read_values(path):
              values = {}
              for line in Path(path).read_text(encoding="ascii").splitlines():
                  if not line or "=" not in line:
                      raise SystemExit(f"invalid provenance line: {line!r}")
                  key, value = line.split("=", 1)
                  if not key or key in values:
                      raise SystemExit(f"invalid provenance key: {key!r}")
                  values[key] = value
              return values

          values = read_values("build/compiled/macos-build.provenance.txt")
          expected = {
              "commit": os.environ["GITHUB_SHA"],
              "executable_sha256": sha256("build/compiled/Noctis-IV.game"),
              "compiler_sha256": sha256("build/compiled/linux-compiler114m.bin"),
              "runtime_sha256": sha256("build/macos-rtm/cocoa-rtm01.bin"),
              "runtime_provenance_sha256": sha256(
                  "build/macos-rtm/cocoa-runtime.provenance.txt"),
              "target": "macos/x64",
          }
          if any(values.get(key) != value for key, value in expected.items()):
              raise SystemExit("tagged macOS build provenance mismatch")

          niv_values = read_values("build/compiled/nivtest-build.provenance.txt")
          niv_expected = {
              "nivtest_provenance_format": "1",
              "commit": os.environ["GITHUB_SHA"],
              "nivtest_executable_sha256": sha256("build/compiled/nivtest"),
              "compiler_sha256": sha256("build/compiled/linux-compiler114m.bin"),
              "runtime_sha256": sha256("build/macos-rtm/headless-rtm01.bin"),
              "runtime_provenance_sha256": sha256(
                  "build/macos-rtm/headless-runtime.provenance.txt"),
              "target": "macos/x64",
          }
          if any(niv_values.get(key) != value for key, value in niv_expected.items()):
              raise SystemExit("tagged NIVTEST provenance mismatch")
          print("Tagged game and NIVTEST provenance verified across both build hosts")
          PY

      - name: Verify exact generation through Rosetta
        shell: bash
        run: |
          set -o pipefail
          test "$(uname -m)" = arm64
          bash tests/run_macos_fcw_probe.sh
          chmod +x build/compiled/nivtest build/compiled/Noctis-IV.game
          arch -x86_64 /usr/bin/true
          python3 tools/nivtest.py json \
            -x -1996209872 -y 55508 -z 816148 -p 2 -lon 0 -lat 60 \
            --diagnostic --exe "$PWD/build/compiled/nivtest" \
            > build/rosetta-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("build/rosetta-result.json").read_text())
          expected = {
              "surf": "390A2CCB",
              "atmo": "114562E8",
              "pal": "26961E4A",
              "hm": "97022FD7",
              "oc": "22913F4E",
              "stex": "0D52F001",
              "sky": "1E308D29",
          }
          got = {name: result["hashes"][name]["fnv"] for name in expected}
          if result["status"] != 0 or got != expected:
              raise SystemExit(f"tagged Rosetta NIVGEN mismatch: {got!r}")
          print("Tagged Rosetta NIVGEN exact: 7/7")
          PY

      - name: Derive bundle versions from the tag
        id: version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(
              r"v(\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?",
              tag,
          )
          if not match:
              raise SystemExit(f"tag cannot form a bundle version: {tag!r}")
          print(f"short={match.group(1)}")
          print(f"label={tag}")
          PY

      - name: Assemble the signed app archive
        shell: bash
        env:
          BUNDLE_SHORT_VERSION: ${{ steps.version.outputs.short }}
          RELEASE_LABEL: ${{ steps.version.outputs.label }}
        run: |
          python3 tools/package_noctis_macos.py \
            --game build/compiled/Noctis-IV.game \
            --provenance build/compiled/macos-build.provenance.txt \
            --nivtest build/compiled/nivtest \
            --nivtest-provenance build/compiled/nivtest-build.provenance.txt \
            --nivtest-result build/rosetta-result.json \
            --output dist \
            --short-version "$BUNDLE_SHORT_VERSION" \
            --build-version "$GITHUB_RUN_NUMBER" \
            --release-label "$RELEASE_LABEL" \
            --expected-commit "$GITHUB_SHA" \
            --validation-reference-commit 94200172ee2ca859de15f0c7b03dfa1939874681

      - name: Smoke-test the archived Finder app through Rosetta
        shell: bash
        run: |
          rm -rf build/archive-smoke build/noctis-data
          mkdir -p build/archive-smoke
          ditto -x -k dist/Noctis-IV-macos-x86_64.zip build/archive-smoke
          app="$PWD/build/archive-smoke/Noctis IV.app"
          launcher="$app/Contents/MacOS/Noctis-IV"
          data="$PWD/build/noctis-data"
          codesign --verify --deep --strict --verbose=2 "$app"
          python3 - <<'PY'
          from pathlib import Path
          from tools.package_noctis_macos import verify_manifest
          verify_manifest(Path("build/archive-smoke/Noctis IV.app"))
          PY
          NOCTIS_DATA_DIR="$data" arch -x86_64 "$launcher" \
            --launcher-prepare-only >/dev/null
          for seed in STARMAP.BIN GUIDE.BIN; do
            cp "$data/$seed" "build/$seed.seed"
            printf 'preserve-tagged-user-state' >> "$data/$seed"
            cp "$data/$seed" "build/$seed.modified"
          done
          NOCTIS_DATA_DIR="$data" arch -x86_64 "$launcher" \
            --launcher-prepare-only >/dev/null
          for seed in STARMAP.BIN GUIDE.BIN; do
            cmp "$data/$seed" "build/$seed.modified"
          done
          mv "$data/GUIDE.BIN" build/GUIDE.regular
          mkdir "$data/GUIDE.BIN"
          if NOCTIS_DATA_DIR="$data" arch -x86_64 "$launcher" \
              --launcher-prepare-only >/dev/null 2>&1; then
            echo 'launcher accepted a non-regular mutable seed' >&2
            exit 1
          fi
          rmdir "$data/GUIDE.BIN"
          mv build/GUIDE.regular "$data/GUIDE.BIN"
          for seed in STARMAP.BIN GUIDE.BIN; do
            mv "build/$seed.seed" "$data/$seed"
          done
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          launcher = Path("build/archive-smoke/Noctis IV.app/Contents/MacOS/Noctis-IV").resolve()
          env = os.environ.copy()
          env["NOCTIS_DATA_DIR"] = str(Path("build/noctis-data").resolve())
          def run_smoke(switch, marker):
              result = subprocess.run(
                  ["arch", "-x86_64", str(launcher), switch],
                  env=env,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  timeout=120,
              )
              print(result.stdout)
              if result.returncode != 0 or marker not in result.stdout:
                  raise SystemExit(
                      f"tagged {switch} failed with status {result.returncode}")

          run_smoke("--cocoa-smoke", "COCOA_SMOKE_OK")
          run_smoke("--cocoa-quit-smoke", "COCOA_QUIT_SMOKE_OK")
          checkpoint = Path("build/noctis-data/CURRENT.LIN")
          if not checkpoint.is_file() or checkpoint.stat().st_size == 0:
              raise SystemExit("tagged graceful Cocoa quit did not save CURRENT.LIN")
          print("Tagged Cocoa retrace and graceful Lino shutdown both passed")
          PY

      - name: Upload the tagged macOS package
        uses: actions/upload-artifact@v7
        with:
          name: Noctis-IV-macos-x86_64-${{ github.ref_name }}
          path: |
            dist/Noctis-IV-macos-x86_64.zip
            dist/Noctis-IV-macos-x86_64.zip.sha256
            dist/Noctis-IV-macos-x86_64.provenance.txt
          if-no-files-found: error

  arm64_package:
    name: Build and test the native Apple-Silicon package
    needs: validate
    uses: ./.github/workflows/macos-aarch64-runtime.yml
    with:
      tagged_release: true
      package_artifact_name: Noctis-IV-macos-arm64-${{ github.ref_name }}

  publish:
    name: Publish the GitHub release
    needs: [package, mac_package, arm64_package]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the tested Windows package
        uses: actions/download-artifact@v8
        with:
          name: Noctis-IV-windows-x86-${{ github.ref_name }}
          path: dist

      - name: Download the tested macOS x86_64 package
        uses: actions/download-artifact@v8
        with:
          name: Noctis-IV-macos-x86_64-${{ github.ref_name }}
          path: dist

      - name: Download the tested macOS arm64 package
        uses: actions/download-artifact@v8
        with:
          name: Noctis-IV-macos-arm64-${{ github.ref_name }}
          path: dist

      - name: Extract this tag's release notes
        shell: pwsh
        run: |
          python tools\release_notes_for_tag.py $env:GITHUB_REF_NAME --output dist\release-notes.md

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = 'dist\release-notes.md'
          $files = @(
            'dist\Noctis-IV-windows-x86.zip',
            'dist\Noctis-IV-windows-x86.zip.sha256',
            'dist\Noctis-IV-windows-x86.provenance.txt',
            'dist\Noctis-IV-macos-x86_64.zip',
            'dist\Noctis-IV-macos-x86_64.zip.sha256',
            'dist\Noctis-IV-macos-x86_64.provenance.txt',
            'dist\Noctis-IV-macos-arm64.zip',
            'dist\Noctis-IV-macos-arm64.zip.sha256',
            'dist\Noctis-IV-macos-arm64.provenance.txt'
          )
          $expectedNames = @(
            $files | ForEach-Object { Split-Path -Leaf $_ } | Sort-Object
          )
          if ($files.Count -ne 9 -or ($expectedNames | Select-Object -Unique).Count -ne 9) {
            throw 'The release manifest must contain exactly nine unique assets'
          }
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing release asset: $file"
            }
          }
          $actualNames = @(
            Get-ChildItem -LiteralPath dist -File |
              Where-Object Name -ne 'release-notes.md' |
              ForEach-Object Name |
              Sort-Object
          )
          if ($actualNames.Count -ne 9 -or
              @(Compare-Object $expectedNames $actualNames).Count -ne 0) {
            throw "Downloaded assets do not exactly match the nine-file release manifest: $($actualNames -join ', ')"
          }

          $isStable = $tag -cmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$'
          gh release view $tag --json tagName 1>$null 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            $remoteNames = @(gh release view $tag --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing release $tag" }
            $unexpected = @($remoteNames | Where-Object { $_ -notin $expectedNames })
            if ($unexpected.Count) {
              throw "Existing release has unexpected assets; refusing destructive cleanup: $($unexpected -join ', ')"
            }
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not replace release assets for $tag" }
            Write-Host "Existing release body preserved; replaced generated assets only."
          } else {
            $releaseArgs = @(
              'release', 'create', $tag
            ) + $files + @(
              '--verify-tag', '--notes-file', $notes,
              '--title', "Noctis IV L.in.oleum port $tag"
            )
            if (-not $isStable) { $releaseArgs += '--prerelease' }
            gh @releaseArgs
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }
          }

          $publishedNames = @(
            gh release view $tag --json assets --jq '.assets[].name' | Sort-Object
          )
          if ($LASTEXITCODE -ne 0 -or $publishedNames.Count -ne 9 -or
              @(Compare-Object $expectedNames $publishedNames).Count -ne 0) {
            throw "Published release does not contain exactly the nine canonical assets: $($publishedNames -join ', ')"
          }
